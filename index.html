<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>my-portfolio</title>

    <!-- ✅ FAVICON (THIS changes the browser tab icon) -->
    <link rel="icon" type="image/png" href="/react.png" />
    <link rel="apple-touch-icon" href="/react.png" />

    <!-- Google Fonts - Questrial (similar to Essentielle) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">

    <!-- SEO -->
    <meta
      name="description"
      content="My portfolio showcasing my projects, achievements, experience, and case studies in frontend development and AI."
    />
    <meta name="author" content="Your Name" />

    <!-- Open Graph -->
    <meta property="og:title" content="My Portfolio" />
    <meta
      property="og:description"
      content="Explore my projects, case studies, achievements, and experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/react.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Portfolio" />
    <meta
      name="twitter:description"
      content="Projects, case studies, achievements, experience."
    />
    <meta name="twitter:image" content="/react.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
